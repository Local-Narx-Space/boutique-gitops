apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
spec:
  template:
    spec:
      imagePullSecrets:
      - name: ghcr-pull
      containers:
      - name: cart
        volumeMounts:
        - name: data-ca
          mountPath: /run/data-ca
          readOnly: true
      volumes:
      - name: data-ca
        secret:
          secretName: boutique-data-ca
          defaultMode: 292
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: cart
