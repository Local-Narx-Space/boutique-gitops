apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      imagePullSecrets:
      - name: ghcr-pull
      containers:
      - name: frontend
        env:
        - name: PUBLIC_ORIGIN
          value: https://production.boutique.test:9443
        - name: COOKIE_SECURE
          value: 'true'
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: frontend
