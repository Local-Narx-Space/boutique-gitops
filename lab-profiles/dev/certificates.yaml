apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frontend-tls
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  secretName: frontend-tls
  issuerRef:
    name: boutique-lab-ca
    kind: ClusterIssuer
  dnsNames:
  - dev.boutique.test
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
  - digital signature
  - key encipherment
  - server auth
---
