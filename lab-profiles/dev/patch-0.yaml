apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      imagePullSecrets:
      - name: ghcr-pull
      containers:
      - name: frontend
        env:
        - name: PUBLIC_ORIGIN
          value: https://dev.boutique.test:8443
        - name: COOKIE_SECURE
          value: 'true'
