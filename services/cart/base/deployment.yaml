apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels: &id001
    app.kubernetes.io/name: cart
    app.kubernetes.io/part-of: boutique
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: cart
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: cart
        image: ghcr.io/subhankar12-spec/boutique-cart:bootstrap
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8082
        env:
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: cart-redis
              key: url
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          failureThreshold: 60
          periodSeconds: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 7
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
