apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: &id001
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: boutique
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 10001
      containers:
      - name: frontend
        image: ghcr.io/subhankar12-spec/boutique-frontend:bootstrap
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: CATALOGUE_URL
          value: http://catalogue:8081
        - name: CART_URL
          value: http://cart:8082
        - name: ORDERS_URL
          value: http://orders:8083
        - name: PUBLIC_ORIGIN
          value: http://localhost:8080
        - name: COOKIE_SECURE
          value: 'false'
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: frontend-session
              key: secret
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          failureThreshold: 60
          periodSeconds: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 7
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
