apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: boutique-dev
  namespace: argocd
spec:
  sourceRepos:
  - https://github.com/subhankar12-spec/boutique-gitops.git
  destinations:
  - namespace: boutique-dev
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-dev
  namespace: argocd
spec:
  project: boutique-dev
  source:
    repoURL: https://github.com/subhankar12-spec/boutique-gitops.git
    targetRevision: main
    path: environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
