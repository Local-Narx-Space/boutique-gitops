apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: boutique-dev
  namespace: argocd
spec:
  sourceRepos:
  - https://github.com/subhankar12-spec/boutique-gitops.git
  destinations:
  - namespace: boutique-dev
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
---
