apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: boutique-monitoring-production
  namespace: argocd
spec:
  sourceRepos:
  - https://github.com/subhankar12-spec/boutique-gitops.git
  destinations:
  - namespace: monitoring
    server: https://kubernetes.default.svc
  - namespace: monitoring-logs
    server: https://kubernetes.default.svc
  - namespace: boutique-production
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: ''
    kind: PersistentVolumeClaim
  - group: apps
    kind: Deployment
  - group: apps
    kind: DaemonSet
  - group: rbac.authorization.k8s.io
    kind: Role
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: policy
    kind: PodDisruptionBudget
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-monitoring-production
  namespace: argocd
spec:
  project: boutique-monitoring-production
  source:
    repoURL: https://github.com/subhankar12-spec/boutique-gitops.git
    targetRevision: main
    path: monitoring
    helm:
      releaseName: boutique-monitoring-production
      valueFiles:
      - profiles/production/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
    - ApplyOutOfSyncOnly=true
