apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: boutique-laptop
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - list:
      elements:
      - environment: dev
        autoSync: true
        progressiveDelivery: false
      # Enabled after namespace secrets and release selection were prepared.
      - environment: staging
        autoSync: true
        progressiveDelivery: false
      - environment: production
        autoSync: true
        progressiveDelivery: false
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'boutique-{{.environment}}'
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: boutique
        boutique.environment: '{{.environment}}'
    spec:
      project: 'boutique-{{.environment}}'
      source:
        repoURL: https://github.com/subhankar12-spec/boutique-gitops.git
        targetRevision: main
        path: 'environments/{{.environment}}'
        helm:
          releaseName: 'boutique-{{.environment}}'
          valueFiles:
          - values.yaml
          - releases.yaml
          - '../../laptop-profiles/{{.environment}}/values.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'boutique-{{.environment}}'
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m
  templatePatch: |
    spec:
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        {{- if .progressiveDelivery }}
        - RespectIgnoreDifferences=true
        {{- end }}
        {{- if .autoSync }}
        automated:
          prune: true
          selfHeal: true
        {{- end }}
      {{- if .progressiveDelivery }}
      # Only these fields belong to the namespace-scoped Rollouts controller.
      # Image, pod template, analysis policy and all other fields stay Git-owned.
      ignoreDifferences:
      - group: apps
        kind: Deployment
        name: frontend
        jsonPointers:
        - /spec/replicas
      - group: ""
        kind: Service
        name: frontend
        jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
      - group: ""
        kind: Service
        name: frontend-preview
        jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
      {{- end }}
