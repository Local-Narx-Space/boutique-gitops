apiVersion: v1
kind: ConfigMap
metadata:
  name: boutique-prometheus
  namespace: monitoring
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\n  external_labels:\n    cluster:\
    \ homelab\nalerting:\n  alertmanagers:\n  - static_configs:\n    - targets:\n\
    \      - alertmanager:9093\nrule_files:\n- /etc/prometheus/rules.yml\nscrape_configs:\n\
    - job_name: boutique\n  metrics_path: /metrics\n  kubernetes_sd_configs:\n  -\
    \ role: pod\n    namespaces:\n      names:\n      - boutique-dev\n    selectors:\n\
    \    - role: pod\n      label: app.kubernetes.io/part-of=boutique\n  relabel_configs:\n\
    \  - source_labels:\n    - __meta_kubernetes_pod_label_app_kubernetes_io_name\n\
    \    regex: frontend|catalogue|cart\n    action: keep\n  - source_labels:\n  \
    \  - __meta_kubernetes_pod_container_port_name\n    regex: http\n    action: keep\n\
    \  - source_labels:\n    - __meta_kubernetes_pod_phase\n    regex: Running\n \
    \   action: keep\n  - source_labels:\n    - __meta_kubernetes_pod_label_app_kubernetes_io_name\n\
    \    target_label: service\n  - source_labels:\n    - __meta_kubernetes_namespace\n\
    \    regex: boutique-(.*)\n    target_label: environment\n    replacement: $1\n\
    \  - source_labels:\n    - __meta_kubernetes_pod_name\n    target_label: pod\n\
    \  - target_label: cluster\n    replacement: homelab\n- job_name: orders\n  metrics_path:\
    \ /actuator/prometheus\n  kubernetes_sd_configs:\n  - role: pod\n    namespaces:\n\
    \      names:\n      - boutique-dev\n    selectors:\n    - role: pod\n      label:\
    \ app.kubernetes.io/part-of=boutique\n  relabel_configs:\n  - source_labels:\n\
    \    - __meta_kubernetes_pod_label_app_kubernetes_io_name\n    regex: orders\n\
    \    action: keep\n  - source_labels:\n    - __meta_kubernetes_pod_container_port_name\n\
    \    regex: http\n    action: keep\n  - source_labels:\n    - __meta_kubernetes_pod_phase\n\
    \    regex: Running\n    action: keep\n  - source_labels:\n    - __meta_kubernetes_pod_label_app_kubernetes_io_name\n\
    \    target_label: service\n  - source_labels:\n    - __meta_kubernetes_namespace\n\
    \    regex: boutique-(.*)\n    target_label: environment\n    replacement: $1\n\
    \  - source_labels:\n    - __meta_kubernetes_pod_name\n    target_label: pod\n\
    \  - target_label: cluster\n    replacement: homelab\n- job_name: prometheus\n\
    \  static_configs:\n  - targets:\n    - localhost:9090\n- job_name: alertmanager\n\
    \  static_configs:\n  - targets:\n    - alertmanager:9093\n- job_name: incident-bridge\n\
    \  static_configs:\n  - targets:\n    - incident-bridge:8084\n"
  rules.yml: "groups:\n- name: boutique\n  rules:\n  - record: boutique:requests:rate5m\n\
    \    expr: sum by (service, environment, cluster) (rate(boutique_http_requests_total[5m]))\n\
    \      or sum by (service, environment, cluster) (rate(http_server_requests_seconds_count{uri!~\"\
    /actuator.*\"}[5m]))\n  - record: boutique:errors:rate5m\n    expr: sum by (service,\
    \ environment, cluster) (rate(boutique_http_requests_total{status=~\"5..\"}[5m]))\n\
    \      or sum by (service, environment, cluster) (rate(http_server_requests_seconds_count{status=~\"\
    5..\",uri!~\"/actuator.*\"}[5m]))\n      or (0 * boutique:requests:rate5m)\n \
    \ - record: boutique:latency:p95\n    expr: histogram_quantile(0.95, sum by (le,\
    \ service, environment, cluster) (rate(boutique_http_request_duration_seconds_bucket[5m])))\n\
    \      or histogram_quantile(0.95, sum by (le, service, environment, cluster)\
    \ (rate(http_server_requests_seconds_bucket{uri!~\"/actuator.*\"}[5m])))\n  -\
    \ alert: BoutiqueServiceDown\n    expr: up{job=~\"boutique|orders\"} == 0\n  \
    \  for: 2m\n    labels:\n      severity: critical\n    annotations:\n      summary:\
    \ '{{ $labels.service }} is unavailable in {{ $labels.environment }}'\n      runbook_url:\
    \ https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md#service-down\n\
    \  - alert: BoutiqueHighErrorRate\n    expr: (boutique:errors:rate5m / boutique:requests:rate5m\
    \ > 0.05) and (boutique:requests:rate5m\n      > 0.1)\n    for: 5m\n    labels:\n\
    \      severity: critical\n    annotations:\n      summary: HTTP 5xx exceeds 5\
    \ percent for {{ $labels.service }}\n  - alert: BoutiqueHighLatency\n    expr:\
    \ (boutique:latency:p95 > 1) and (boutique:requests:rate5m > 0.1)\n    for: 10m\n\
    \    labels:\n      severity: warning\n    annotations:\n      summary: HTTP p95\
    \ exceeds one second for {{ $labels.service }}\n  - alert: IncidentDeliveryBacklog\n\
    \    expr: boutique_incident_oldest_seconds > 300\n    for: 5m\n    labels:\n\
    \      severity: critical\n      service: incident-bridge\n    annotations:\n\
    \      summary: ServiceNow incident delivery has been delayed for over five minutes\n\
    \  - alert: AlertmanagerDeliveryFailures\n    expr: increase(alertmanager_notifications_failed_total[10m])\
    \ > 0\n    for: 2m\n    labels:\n      severity: warning\n    annotations:\n \
    \     summary: Alertmanager receiver delivery is failing\n  - alert: PrometheusRuleFailures\n\
    \    expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0\n    for:\
    \ 2m\n    labels:\n      severity: warning\n    annotations:\n      summary: Prometheus\
    \ rule evaluations are failing\n  - alert: BoutiqueServiceMissing\n    expr: absent(up{job=~\"\
    boutique|orders\",service=\"frontend\",environment=\"dev\",cluster=\"homelab\"\
    })\n    for: 2m\n    labels:\n      severity: critical\n    annotations:\n   \
    \   summary: No running scrape targets for frontend in dev\n  - alert: BoutiqueServiceMissing\n\
    \    expr: absent(up{job=~\"boutique|orders\",service=\"catalogue\",environment=\"\
    dev\",cluster=\"homelab\"})\n    for: 2m\n    labels:\n      severity: critical\n\
    \    annotations:\n      summary: No running scrape targets for catalogue in dev\n\
    \  - alert: BoutiqueServiceMissing\n    expr: absent(up{job=~\"boutique|orders\"\
    ,service=\"cart\",environment=\"dev\",cluster=\"homelab\"})\n    for: 2m\n   \
    \ labels:\n      severity: critical\n    annotations:\n      summary: No running\
    \ scrape targets for cart in dev\n  - alert: BoutiqueServiceMissing\n    expr:\
    \ absent(up{job=~\"boutique|orders\",service=\"orders\",environment=\"dev\",cluster=\"\
    homelab\"})\n    for: 2m\n    labels:\n      severity: critical\n    annotations:\n\
    \      summary: No running scrape targets for orders in dev\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: prometheus
        image: prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/data
        - --storage.tsdb.retention.time=7d
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 30
          timeoutSeconds: 3
      volumes:
      - name: config
        configMap:
          name: boutique-prometheus
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
      serviceAccountName: prometheus
  strategy:
    type: Recreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
