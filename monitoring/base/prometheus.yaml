apiVersion: v1
kind: ConfigMap
metadata:
  name: boutique-prometheus
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      external_labels:
        cluster: homelab
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093
    rule_files:
    - /etc/prometheus/rules.yml
    scrape_configs:
    - job_name: boutique
      metrics_path: /metrics
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - boutique-dev
        selectors:
        - role: pod
          label: app.kubernetes.io/part-of=boutique
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_pod_label_app_kubernetes_io_name
        regex: frontend|catalogue|cart
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_container_port_name
        regex: http
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_phase
        regex: Running
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_label_app_kubernetes_io_name
        target_label: service
      - source_labels:
        - __meta_kubernetes_namespace
        regex: boutique-(.*)
        target_label: environment
        replacement: $1
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
      - target_label: cluster
        replacement: homelab
    - job_name: orders
      metrics_path: /actuator/prometheus
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - boutique-dev
        selectors:
        - role: pod
          label: app.kubernetes.io/part-of=boutique
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_pod_label_app_kubernetes_io_name
        regex: orders
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_container_port_name
        regex: http
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_phase
        regex: Running
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_label_app_kubernetes_io_name
        target_label: service
      - source_labels:
        - __meta_kubernetes_namespace
        regex: boutique-(.*)
        target_label: environment
        replacement: $1
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
      - target_label: cluster
        replacement: homelab
    - job_name: prometheus
      static_configs:
      - targets:
        - localhost:9090
    - job_name: alertmanager
      static_configs:
      - targets:
        - alertmanager:9093
    - job_name: incident-bridge
      metrics_path: /metrics
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - monitoring
        selectors:
        - role: pod
          label: app=incident-bridge
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_pod_container_name
        regex: incident-bridge
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_container_port_name
        regex: http
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_phase
        regex: Running
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
      - source_labels:
        - __meta_kubernetes_namespace
        target_label: namespace
      - target_label: service
        replacement: incident-bridge
      - target_label: environment
        replacement: dev
      - target_label: cluster
        replacement: homelab
  rules.yml: |
    groups:
    - name: boutique
      rules:
      - record: boutique:incident:pending
        expr: max by (cluster, environment) (boutique_incident_pending{job="incident-bridge"})
      - record: boutique:incident:oldest_seconds
        expr: max by (cluster, environment) (boutique_incident_oldest_seconds{job="incident-bridge"})
      - record: boutique:incident:dead_letters
        expr: max by (cluster, environment) (boutique_incident_dead_letters{job="incident-bridge"})
      - record: boutique:incident:retry_attempts
        expr: max by (cluster, environment) (boutique_incident_retry_attempts{job="incident-bridge"})
      - record: boutique:requests:rate5m
        expr: sum by (service, environment, cluster) (rate(boutique_http_requests_total[5m])) or sum by (service, environment,
          cluster) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
      - record: boutique:errors:rate5m
        expr: sum by (service, environment, cluster) (rate(boutique_http_requests_total{status=~"5.."}[5m])) or sum by (service,
          environment, cluster) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[5m])) or (0 * boutique:requests:rate5m)
      - record: boutique:latency:p95
        expr: histogram_quantile(0.95, sum by (le, service, environment, cluster) (rate(boutique_http_request_duration_seconds_bucket[5m])))
          or histogram_quantile(0.95, sum by (le, service, environment, cluster) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m])))
      - alert: BoutiqueServiceDown
        expr: up{job=~"boutique|orders"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.service }} is unavailable in {{ $labels.environment }}'
          runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md#service-down
      - alert: BoutiqueHighErrorRate
        expr: (boutique:errors:rate5m / boutique:requests:rate5m > 0.05) and (boutique:requests:rate5m > 0.1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: HTTP 5xx exceeds 5 percent for {{ $labels.service }}
      - alert: BoutiqueHighLatency
        expr: (boutique:latency:p95 > 1) and (boutique:requests:rate5m > 0.1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: HTTP p95 exceeds one second for {{ $labels.service }}
      - alert: AlertmanagerDeliveryFailures
        expr: increase(alertmanager_notifications_failed_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
          incident_delivery: disabled
        annotations:
          summary: Alertmanager receiver delivery is failing
      - alert: PrometheusRuleFailures
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Prometheus rule evaluations are failing
      - alert: BoutiqueServiceMissing
        expr: absent(up{job=~"boutique|orders",service="frontend",environment="dev",cluster="homelab"})
        for: 2m
        labels:
          severity: critical
          service: frontend
          environment: dev
          cluster: homelab
        annotations:
          summary: No running scrape targets for frontend in dev
      - alert: BoutiqueServiceMissing
        expr: absent(up{job=~"boutique|orders",service="catalogue",environment="dev",cluster="homelab"})
        for: 2m
        labels:
          severity: critical
          service: catalogue
          environment: dev
          cluster: homelab
        annotations:
          summary: No running scrape targets for catalogue in dev
      - alert: BoutiqueServiceMissing
        expr: absent(up{job=~"boutique|orders",service="cart",environment="dev",cluster="homelab"})
        for: 2m
        labels:
          severity: critical
          service: cart
          environment: dev
          cluster: homelab
        annotations:
          summary: No running scrape targets for cart in dev
      - alert: BoutiqueServiceMissing
        expr: absent(up{job=~"boutique|orders",service="orders",environment="dev",cluster="homelab"})
        for: 2m
        labels:
          severity: critical
          service: orders
          environment: dev
          cluster: homelab
        annotations:
          summary: No running scrape targets for orders in dev
      - alert: IncidentDeliveryBacklog
        expr: boutique:incident:oldest_seconds > 300
        for: 5m
        labels:
          severity: critical
          service: incident-bridge
          incident_delivery: disabled
        annotations:
          summary: ServiceNow incident delivery has been delayed for over five minutes
          runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
      - alert: IncidentDeliveryDeadLetters
        expr: boutique:incident:dead_letters > 0
        for: 1m
        labels:
          severity: critical
          service: incident-bridge
          incident_delivery: disabled
        annotations:
          summary: Incident delivery exhausted retries; operator recovery is required
          runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
      - alert: IncidentWorkerStalled
        expr: boutique_incident_worker_heartbeat_age_seconds{job="incident-bridge"} > 60
        for: 2m
        labels:
          severity: critical
          service: incident-bridge
          incident_delivery: disabled
        annotations:
          summary: Incident worker {{ $labels.pod }} heartbeat is stale
          runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
      - alert: IncidentBridgeUnavailable
        expr: up{job="incident-bridge"} == 0
        for: 2m
        labels:
          severity: critical
          service: incident-bridge
          incident_delivery: disabled
        annotations:
          summary: Incident bridge {{ $labels.pod }} cannot be scraped
          runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
      - alert: IncidentBridgeMissing
        expr: absent(up{job="incident-bridge"})
        for: 2m
        labels:
          severity: critical
          service: incident-bridge
          incident_delivery: disabled
        annotations:
          summary: No incident bridge scrape targets are present
          runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: prometheus
        image: prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/data
        - --storage.tsdb.retention.time=7d
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 30
          timeoutSeconds: 3
      volumes:
      - name: config
        configMap:
          name: boutique-prometheus
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
      serviceAccountName: prometheus
  strategy:
    type: Recreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
