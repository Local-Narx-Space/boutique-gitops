apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-logs
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: monitoring-logs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boutique-alloy
  namespace: monitoring-logs
data:
  config.alloy: "discovery.kubernetes \"pods\" {\n  role = \"pod\"\n  namespaces {\
    \ names = [\"boutique-dev\"] }\n  selectors {\n    role = \"pod\"\n    label =\
    \ \"app.kubernetes.io/part-of=boutique\"\n    field = \"spec.nodeName=\" + sys.env(\"\
    NODE_NAME\")\n  }\n}\ndiscovery.relabel \"logs\" {\n  targets = discovery.kubernetes.pods.targets\n\
    \  rule { source_labels = [\"__meta_kubernetes_namespace\"]\n    target_label\
    \ = \"environment\"\n    regex = \"boutique-(.*)\"\n    replacement = \"$1\" }\n\
    \  rule { source_labels = [\"__meta_kubernetes_namespace\"]\n    regex = \"boutique-(dev|staging|production)\"\
    \n    action = \"keep\" }\n  rule { source_labels = [\"__meta_kubernetes_pod_label_app_kubernetes_io_name\"\
    ]\n    target_label = \"service\" }\n  rule { source_labels = [\"__meta_kubernetes_pod_container_name\"\
    ]\n    target_label = \"container\" }\n  rule { source_labels = [\"__meta_kubernetes_pod_uid\"\
    , \"__meta_kubernetes_pod_container_name\"]\n    separator = \"/\"\n    target_label\
    \ = \"__path__\"\n    replacement = \"/var/log/pods/*$1/*.log\" }\n  rule {\n\
    \    target_label = \"cluster\"\n    replacement = sys.env(\"CLUSTER_NAME\") }\n\
    }\nloki.source.file \"pods\" {\n  targets = discovery.relabel.logs.output\n  forward_to\
    \ = [loki.process.cri.receiver]\n}\nloki.process \"cri\" {\n  stage.cri {}\n \
    \ forward_to = [loki.write.default.receiver]\n}\nloki.write \"default\" {\n  endpoint\
    \ { url = \"http://loki.monitoring.svc:3100/loki/api/v1/push\" }\n}\n"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: monitoring-logs
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
      - name: alloy
        image: grafana/alloy@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/var/lib/alloy
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CLUSTER_NAME
          value: homelab
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
          readOnly: true
        - name: logs
          mountPath: /var/log/pods
          readOnly: true
        - name: state
          mountPath: /var/lib/alloy
      volumes:
      - name: config
        configMap:
          name: boutique-alloy
      - name: logs
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: state
        emptyDir: {}
