apiVersion: v1
kind: ConfigMap
metadata:
  name: boutique-grafana
  namespace: monitoring
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
    - access: proxy
      isDefault: true
      name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://prometheus:9090
    - access: proxy
      name: Loki
      type: loki
      uid: loki
      url: http://loki:3100
  dashboards.yml: |
    apiVersion: 1
    providers:
    - name: Boutique
      options:
        path: /var/lib/grafana/dashboards
      type: file
  boutique.json: |
    {
      "uid": "boutique-overview",
      "title": "Boutique operations",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "environment",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(up{job=~\"boutique|orders\"}, environment)",
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Service availability",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "min by(service,environment) (up{job=~\"boutique|orders\",environment=~\"$environment\"})",
              "refId": "A",
              "legendFormat": "{{service}} {{environment}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Requests per second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "boutique:requests:rate5m{environment=~\"$environment\"}",
              "refId": "A",
              "legendFormat": "{{service}} {{environment}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "HTTP error ratio",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "boutique:errors:rate5m{environment=~\"$environment\"} / boutique:requests:rate5m{environment=~\"$environment\"}",
              "refId": "A",
              "legendFormat": "{{service}} {{environment}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "HTTP p95 seconds",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "boutique:latency:p95{environment=~\"$environment\"}",
              "refId": "A",
              "legendFormat": "{{service}} {{environment}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Firing alerts",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "ALERTS{alertstate=\"firing\"}",
              "refId": "A",
              "legendFormat": "{{service}} {{environment}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Pending incidents",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "boutique:incident:pending",
              "refId": "A",
              "legendFormat": "{{cluster}} {{environment}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Oldest incident seconds",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "boutique:incident:oldest_seconds",
              "refId": "A",
              "legendFormat": "{{cluster}} {{environment}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "JVM heap bytes",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"heap\"}",
              "refId": "A",
              "legendFormat": "{{service}} {{environment}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Frontend heap bytes",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "boutique_node_heap_bytes",
              "refId": "A",
              "legendFormat": "{{service}} {{environment}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "logs",
          "title": "Application logs",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 48,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "expr": "{environment=~\"$environment\",service=~\"frontend|catalogue|cart|orders\"}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Incident dead letters",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "boutique:incident:dead_letters",
              "refId": "A",
              "legendFormat": "{{cluster}} {{environment}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Incident worker heartbeat age seconds",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 40,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "boutique_incident_worker_heartbeat_age_seconds{job=\"incident-bridge\"}",
              "refId": "A",
              "legendFormat": "{{cluster}} {{pod}}"
            }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Incident bridge scrape availability",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 40,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "up{job=\"incident-bridge\"}",
              "refId": "A",
              "legendFormat": "{{cluster}} {{pod}}"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD__FILE
          value: /run/secrets/grafana_password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: tmp
          mountPath: /tmp
        - name: secrets
          mountPath: /run/secrets
          readOnly: true
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/datasources.yml
          subPath: datasources.yml
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
          subPath: dashboards.yml
        - name: config
          mountPath: /var/lib/grafana/dashboards/boutique.json
          subPath: boutique.json
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: tmp
        emptyDir: {}
      - name: secrets
        secret:
          secretName: monitoring-integrations
          defaultMode: 292
          items:
          - key: grafana_password
            path: grafana_password
      - name: config
        configMap:
          name: boutique-grafana
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: http
