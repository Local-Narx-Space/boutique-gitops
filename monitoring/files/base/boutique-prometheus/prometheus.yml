global:
  scrape_interval: 15s
  external_labels:
    cluster: homelab
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
rule_files:
- /etc/prometheus/rules.yml
scrape_configs:
- job_name: boutique
  metrics_path: /metrics
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - boutique-dev
    selectors:
    - role: pod
      label: app.kubernetes.io/part-of=boutique
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    regex: frontend|catalogue|cart
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    regex: http
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_phase
    regex: Running
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    target_label: service
  - source_labels:
    - __meta_kubernetes_namespace
    regex: boutique-(.*)
    target_label: environment
    replacement: $1
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - target_label: cluster
    replacement: homelab
- job_name: orders
  metrics_path: /actuator/prometheus
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - boutique-dev
    selectors:
    - role: pod
      label: app.kubernetes.io/part-of=boutique
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    regex: orders
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    regex: http
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_phase
    regex: Running
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    target_label: service
  - source_labels:
    - __meta_kubernetes_namespace
    regex: boutique-(.*)
    target_label: environment
    replacement: $1
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - target_label: cluster
    replacement: homelab
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: alertmanager
  static_configs:
  - targets:
    - alertmanager:9093
- job_name: incident-bridge
  metrics_path: /metrics
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - monitoring
    selectors:
    - role: pod
      label: app=incident-bridge
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_container_name
    regex: incident-bridge
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    regex: http
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_phase
    regex: Running
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - target_label: service
    replacement: incident-bridge
  - target_label: environment
    replacement: dev
  - target_label: cluster
    replacement: homelab
