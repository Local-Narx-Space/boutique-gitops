groups:
- name: boutique
  rules:
  - record: boutique:incident:pending
    expr: max by (cluster, environment) (boutique_incident_pending{job="incident-bridge"})
  - record: boutique:incident:oldest_seconds
    expr: max by (cluster, environment) (boutique_incident_oldest_seconds{job="incident-bridge"})
  - record: boutique:incident:dead_letters
    expr: max by (cluster, environment) (boutique_incident_dead_letters{job="incident-bridge"})
  - record: boutique:incident:retry_attempts
    expr: max by (cluster, environment) (boutique_incident_retry_attempts{job="incident-bridge"})
  - record: boutique:requests:rate5m
    expr: sum by (service, environment, cluster) (rate(boutique_http_requests_total[5m])) or sum by (service, environment,
      cluster) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
  - record: boutique:errors:rate5m
    expr: sum by (service, environment, cluster) (rate(boutique_http_requests_total{status=~"5.."}[5m])) or sum by (service,
      environment, cluster) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[5m])) or (0 * boutique:requests:rate5m)
  - record: boutique:latency:p95
    expr: histogram_quantile(0.95, sum by (le, service, environment, cluster) (rate(boutique_http_request_duration_seconds_bucket[5m])))
      or histogram_quantile(0.95, sum by (le, service, environment, cluster) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m])))
  - alert: BoutiqueServiceDown
    expr: up{job=~"boutique|orders"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.service }} is unavailable in {{ $labels.environment }}'
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md#service-down
  - alert: BoutiqueHighErrorRate
    expr: (boutique:errors:rate5m / boutique:requests:rate5m > 0.05) and (boutique:requests:rate5m > 0.1)
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: HTTP 5xx exceeds 5 percent for {{ $labels.service }}
  - alert: BoutiqueHighLatency
    expr: (boutique:latency:p95 > 1) and (boutique:requests:rate5m > 0.1)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: HTTP p95 exceeds one second for {{ $labels.service }}
  - alert: AlertmanagerDeliveryFailures
    expr: increase(alertmanager_notifications_failed_total[10m]) > 0
    for: 2m
    labels:
      severity: warning
      incident_delivery: disabled
    annotations:
      summary: Alertmanager receiver delivery is failing
  - alert: PrometheusRuleFailures
    expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Prometheus rule evaluations are failing
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="frontend",environment="dev",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: frontend
      environment: dev
      cluster: homelab
    annotations:
      summary: No running scrape targets for frontend in dev
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="catalogue",environment="dev",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: catalogue
      environment: dev
      cluster: homelab
    annotations:
      summary: No running scrape targets for catalogue in dev
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="cart",environment="dev",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: cart
      environment: dev
      cluster: homelab
    annotations:
      summary: No running scrape targets for cart in dev
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="orders",environment="dev",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: orders
      environment: dev
      cluster: homelab
    annotations:
      summary: No running scrape targets for orders in dev
  - alert: IncidentDeliveryBacklog
    expr: boutique:incident:oldest_seconds > 300
    for: 5m
    labels:
      severity: critical
      service: incident-bridge
      incident_delivery: disabled
    annotations:
      summary: ServiceNow incident delivery has been delayed for over five minutes
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
  - alert: IncidentDeliveryDeadLetters
    expr: boutique:incident:dead_letters > 0
    for: 1m
    labels:
      severity: critical
      service: incident-bridge
      incident_delivery: disabled
    annotations:
      summary: Incident delivery exhausted retries; operator recovery is required
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
  - alert: IncidentWorkerStalled
    expr: boutique_incident_worker_heartbeat_age_seconds{job="incident-bridge"} > 60
    for: 2m
    labels:
      severity: critical
      service: incident-bridge
      incident_delivery: disabled
    annotations:
      summary: Incident worker {{ $labels.pod }} heartbeat is stale
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
  - alert: IncidentBridgeUnavailable
    expr: up{job="incident-bridge"} == 0
    for: 2m
    labels:
      severity: critical
      service: incident-bridge
      incident_delivery: disabled
    annotations:
      summary: Incident bridge {{ $labels.pod }} cannot be scraped
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
  - alert: IncidentBridgeMissing
    expr: absent(up{job="incident-bridge"})
    for: 2m
    labels:
      severity: critical
      service: incident-bridge
      incident_delivery: disabled
    annotations:
      summary: No incident bridge scrape targets are present
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
- name: progressive-delivery
  rules:
  - alert: BoutiqueReleaseAborted
    expr: rollout_info{job="argo-rollouts",namespace=~"boutique-(dev|staging|production)",phase="Degraded"}
      == 1
    for: 30s
    labels:
      severity: warning
      service: frontend
    annotations:
      summary: Frontend release aborted in {{ $labels.environment }}; inspect stable
        traffic and failed analysis
      runbook_url: https://github.com/subhankar12-spec/boutique-gitops/blob/main/docs/progressive-delivery.md#failed-release
  - alert: BoutiqueRolloutControllerUnavailable
    expr: kube_deployment_status_replicas_available{deployment="argo-rollouts",namespace=~"boutique-(dev|staging|production)"}
      < 1
    for: 1m
    labels:
      severity: critical
      service: frontend-rollouts
    annotations:
      summary: Progressive delivery controller unavailable in {{ $labels.namespace
        }}
      runbook_url: https://github.com/subhankar12-spec/boutique-gitops/blob/main/docs/progressive-delivery.md#controller-unavailable
