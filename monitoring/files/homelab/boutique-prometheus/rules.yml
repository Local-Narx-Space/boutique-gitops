groups:
- name: boutique
  rules:
  - record: boutique:incident:pending
    expr: max by (cluster, environment) (boutique_incident_pending{job="incident-bridge"})
  - record: boutique:incident:oldest_seconds
    expr: max by (cluster, environment) (boutique_incident_oldest_seconds{job="incident-bridge"})
  - record: boutique:incident:dead_letters
    expr: max by (cluster, environment) (boutique_incident_dead_letters{job="incident-bridge"})
  - record: boutique:incident:retry_attempts
    expr: max by (cluster, environment) (boutique_incident_retry_attempts{job="incident-bridge"})
  - record: boutique:requests:rate5m
    expr: sum by (service, environment, cluster) (rate(boutique_http_requests_total[5m]))
      or sum by (service, environment, cluster) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
  - record: boutique:errors:rate5m
    expr: sum by (service, environment, cluster) (rate(boutique_http_requests_total{status=~"5.."}[5m]))
      or sum by (service, environment, cluster) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[5m]))
      or (0 * boutique:requests:rate5m)
  - record: boutique:latency:p95
    expr: histogram_quantile(0.95, sum by (le, service, environment, cluster) (rate(boutique_http_request_duration_seconds_bucket[5m])))
      or histogram_quantile(0.95, sum by (le, service, environment, cluster) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m])))
  - alert: BoutiqueServiceDown
    expr: up{job=~"boutique|orders"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.service }} is unavailable in {{ $labels.environment }}'
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md#service-down
  - alert: BoutiqueHighErrorRate
    expr: (boutique:errors:rate5m / boutique:requests:rate5m > 0.05) and (boutique:requests:rate5m
      > 0.1)
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: HTTP 5xx exceeds 5 percent for {{ $labels.service }}
  - alert: BoutiqueHighLatency
    expr: (boutique:latency:p95 > 1) and (boutique:requests:rate5m > 0.1)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: HTTP p95 exceeds one second for {{ $labels.service }}
  - alert: AlertmanagerDeliveryFailures
    expr: increase(alertmanager_notifications_failed_total[10m]) > 0
    for: 2m
    labels:
      severity: warning
      incident_delivery: disabled
    annotations:
      summary: Alertmanager receiver delivery is failing
  - alert: PrometheusRuleFailures
    expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Prometheus rule evaluations are failing
  - alert: IncidentDeliveryBacklog
    expr: boutique:incident:oldest_seconds > 300
    for: 5m
    labels:
      severity: critical
      service: incident-bridge
      incident_delivery: disabled
    annotations:
      summary: ServiceNow incident delivery has been delayed for over five minutes
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
  - alert: IncidentDeliveryDeadLetters
    expr: boutique:incident:dead_letters > 0
    for: 1m
    labels:
      severity: critical
      service: incident-bridge
      incident_delivery: disabled
    annotations:
      summary: Incident delivery exhausted retries; operator recovery is required
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
  - alert: IncidentWorkerStalled
    expr: boutique_incident_worker_heartbeat_age_seconds{job="incident-bridge"} >
      60
    for: 2m
    labels:
      severity: critical
      service: incident-bridge
      incident_delivery: disabled
    annotations:
      summary: Incident worker {{ $labels.pod }} heartbeat is stale
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
  - alert: IncidentBridgeUnavailable
    expr: up{job="incident-bridge"} == 0
    for: 2m
    labels:
      severity: critical
      service: incident-bridge
      incident_delivery: disabled
    annotations:
      summary: Incident bridge {{ $labels.pod }} cannot be scraped
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
  - alert: IncidentBridgeMissing
    expr: absent(up{job="incident-bridge"})
    for: 2m
    labels:
      severity: critical
      service: incident-bridge
      incident_delivery: disabled
    annotations:
      summary: No incident bridge scrape targets are present
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="frontend",environment="dev",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: frontend
      environment: dev
      cluster: homelab
    annotations:
      summary: No running scrape targets for frontend in dev
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="catalogue",environment="dev",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: catalogue
      environment: dev
      cluster: homelab
    annotations:
      summary: No running scrape targets for catalogue in dev
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="cart",environment="dev",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: cart
      environment: dev
      cluster: homelab
    annotations:
      summary: No running scrape targets for cart in dev
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="orders",environment="dev",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: orders
      environment: dev
      cluster: homelab
    annotations:
      summary: No running scrape targets for orders in dev
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="frontend",environment="staging",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: frontend
      environment: staging
      cluster: homelab
    annotations:
      summary: No running scrape targets for frontend in staging
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="catalogue",environment="staging",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: catalogue
      environment: staging
      cluster: homelab
    annotations:
      summary: No running scrape targets for catalogue in staging
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="cart",environment="staging",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: cart
      environment: staging
      cluster: homelab
    annotations:
      summary: No running scrape targets for cart in staging
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="orders",environment="staging",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: orders
      environment: staging
      cluster: homelab
    annotations:
      summary: No running scrape targets for orders in staging
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="frontend",environment="production",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: frontend
      environment: production
      cluster: homelab
    annotations:
      summary: No running scrape targets for frontend in production
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="catalogue",environment="production",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: catalogue
      environment: production
      cluster: homelab
    annotations:
      summary: No running scrape targets for catalogue in production
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="cart",environment="production",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: cart
      environment: production
      cluster: homelab
    annotations:
      summary: No running scrape targets for cart in production
  - alert: BoutiqueServiceMissing
    expr: absent(up{job=~"boutique|orders",service="orders",environment="production",cluster="homelab"})
    for: 2m
    labels:
      severity: critical
      service: orders
      environment: production
      cluster: homelab
    annotations:
      summary: No running scrape targets for orders in production
- name: boutique-production-slos
  rules:
  - record: boutique:slo_api_eligible:increase6h
    expr: sum by (cluster, environment, service) (increase(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[235].."}[6h]))
  - record: boutique:slo_api_eligible:increase1h
    expr: sum by (cluster, environment, service) (increase(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[235].."}[1h]))
  - record: boutique:slo_api_requests:rate5m
    expr: sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[235].."}[5m]))
  - record: boutique:slo_api_errors:ratio5m
    expr: ((sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"5.."}[5m])))
      or (0 * (sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[235].."}[5m])))))
      / (sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[235].."}[5m])))
  - record: boutique:slo_api_slow:ratio5m
    expr: 1 - ((sum by (cluster, environment, service) (rate(boutique_http_request_duration_seconds_bucket{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[23]..",le="1"}[5m])))
      / (sum by (cluster, environment, service) (rate(boutique_http_request_duration_seconds_count{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[23].."}[5m]))))
  - record: boutique:slo_api_requests:rate30m
    expr: sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[235].."}[30m]))
  - record: boutique:slo_api_errors:ratio30m
    expr: ((sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"5.."}[30m])))
      or (0 * (sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[235].."}[30m])))))
      / (sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[235].."}[30m])))
  - record: boutique:slo_api_slow:ratio30m
    expr: 1 - ((sum by (cluster, environment, service) (rate(boutique_http_request_duration_seconds_bucket{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[23]..",le="1"}[30m])))
      / (sum by (cluster, environment, service) (rate(boutique_http_request_duration_seconds_count{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[23].."}[30m]))))
  - record: boutique:slo_api_requests:rate1h
    expr: sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[235].."}[1h]))
  - record: boutique:slo_api_errors:ratio1h
    expr: ((sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"5.."}[1h])))
      or (0 * (sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[235].."}[1h])))))
      / (sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[235].."}[1h])))
  - record: boutique:slo_api_slow:ratio1h
    expr: 1 - ((sum by (cluster, environment, service) (rate(boutique_http_request_duration_seconds_bucket{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[23]..",le="1"}[1h])))
      / (sum by (cluster, environment, service) (rate(boutique_http_request_duration_seconds_count{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[23].."}[1h]))))
  - record: boutique:slo_api_requests:rate6h
    expr: sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[235].."}[6h]))
  - record: boutique:slo_api_errors:ratio6h
    expr: ((sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"5.."}[6h])))
      or (0 * (sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[235].."}[6h])))))
      / (sum by (cluster, environment, service) (rate(boutique_http_requests_total{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[235].."}[6h])))
  - record: boutique:slo_api_slow:ratio6h
    expr: 1 - ((sum by (cluster, environment, service) (rate(boutique_http_request_duration_seconds_bucket{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[23]..",le="1"}[6h])))
      / (sum by (cluster, environment, service) (rate(boutique_http_request_duration_seconds_count{service="frontend",route=~"/api/(products|cart|cart/items/:product|orders|orders/:id)",method=~"GET|POST|PUT|DELETE",status=~"[23].."}[6h]))))
  - alert: BoutiqueProductionAvailabilityBudgetBurn
    expr: (boutique:slo_api_errors:ratio5m{environment="production"} > 0.0144) and
      (boutique:slo_api_errors:ratio1h{environment="production"} > 0.0144) and (boutique:slo_api_eligible:increase1h{environment="production"}
      >= 100)
    for: 2m
    labels:
      severity: critical
      slo: errors
    annotations:
      summary: Production API availability budget is burning at over 14.4x
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/slo.md
  - alert: BoutiqueProductionAvailabilityBudgetBurn
    expr: (boutique:slo_api_errors:ratio30m{environment="production"} > 0.006) and
      (boutique:slo_api_errors:ratio6h{environment="production"} > 0.006) and (boutique:slo_api_eligible:increase6h{environment="production"}
      >= 100)
    for: 2m
    labels:
      severity: warning
      slo: errors
    annotations:
      summary: Production API availability budget is burning at over 6x
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/slo.md
  - alert: BoutiqueProductionLatencyBudgetBurn
    expr: (boutique:slo_api_slow:ratio5m{environment="production"} > 0.144) and (boutique:slo_api_slow:ratio1h{environment="production"}
      > 0.144) and (boutique:slo_api_eligible:increase1h{environment="production"}
      >= 100)
    for: 2m
    labels:
      severity: critical
      slo: slow
    annotations:
      summary: Production API latency budget is burning at over 14.4x
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/slo.md
  - alert: BoutiqueProductionLatencyBudgetBurn
    expr: (boutique:slo_api_slow:ratio30m{environment="production"} > 0.06) and (boutique:slo_api_slow:ratio6h{environment="production"}
      > 0.06) and (boutique:slo_api_eligible:increase6h{environment="production"}
      >= 100)
    for: 2m
    labels:
      severity: warning
      slo: slow
    annotations:
      summary: Production API latency budget is burning at over 6x
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/slo.md
- name: boutique-platform-health
  rules:
  - alert: KubernetesDeploymentUnavailable
    expr: kube_deployment_status_replicas_available < kube_deployment_spec_replicas
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Deployment {{ $labels.deployment }} is below desired replicas in {{
        $labels.namespace }}
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: KubernetesPodCrashLoop
    expr: sum by (cluster, environment, namespace, pod, container) (increase(kube_pod_container_status_restarts_total[15m]))
      > 3
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Pod {{ $labels.pod }} is restarting repeatedly
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: KubernetesPodPending
    expr: kube_pod_status_phase{phase="Pending"} == 1
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Pod {{ $labels.pod }} remains Pending
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: KubernetesPVCNotBound
    expr: kube_persistentvolumeclaim_status_phase{phase=~"Pending|Lost"} == 1
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: PVC {{ $labels.persistentvolumeclaim }} is not Bound
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: NodeMemoryPressure
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Node {{ $labels.node }} has less than ten percent memory available
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: NodeFilesystemSpaceLow
    expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes
      < 0.1) and on(instance,device,mountpoint) (node_filesystem_readonly == 0)
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Node {{ $labels.node }} filesystem {{ $labels.mountpoint }} is low
        on space
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: MonitoringScrapeFailed
    expr: up{job=~"prometheus|alertmanager|loki|alloy|node-exporter|kube-state-metrics|kube-state-metrics-self|http-probe"}
      == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Monitoring target {{ $labels.job }} cannot be scraped
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: MonitoringTargetMissing
    expr: absent(up{job="loki"})
    for: 5m
    labels:
      severity: critical
      job: loki
      environment: platform
      cluster: homelab
    annotations:
      summary: No loki targets are discovered
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: MonitoringTargetMissing
    expr: absent(up{job="alloy"})
    for: 5m
    labels:
      severity: critical
      job: alloy
      environment: platform
      cluster: homelab
    annotations:
      summary: No alloy targets are discovered
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: MonitoringTargetMissing
    expr: absent(up{job="node-exporter"})
    for: 5m
    labels:
      severity: critical
      job: node-exporter
      environment: platform
      cluster: homelab
    annotations:
      summary: No node-exporter targets are discovered
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: MonitoringTargetMissing
    expr: absent(up{job="kube-state-metrics"})
    for: 5m
    labels:
      severity: critical
      job: kube-state-metrics
      environment: platform
      cluster: homelab
    annotations:
      summary: No kube-state-metrics targets are discovered
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: NodeExporterCoverageGap
    expr: kube_daemonset_status_number_available{daemonset="node-exporter",namespace="monitoring-logs"}
      < kube_daemonset_status_desired_number_scheduled{daemonset="node-exporter",namespace="monitoring-logs"}
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Node exporter is missing from one or more eligible nodes
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: AlloyCoverageGap
    expr: kube_daemonset_status_number_available{daemonset="alloy",namespace="monitoring-logs"}
      < kube_daemonset_status_desired_number_scheduled{daemonset="alloy",namespace="monitoring-logs"}
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Alloy log collection is missing from one or more eligible nodes
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: AlloyDroppedLogs
    expr: sum by (cluster, environment, node) (increase(loki_write_dropped_entries_total[10m]))
      > 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Alloy has dropped log entries
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: KubeStateMetricsDiscoveryErrors
    expr: (sum by (cluster, environment) (increase(kube_state_metrics_list_total{result="error"}[10m]))
      > 0) or (sum by (cluster, environment) (increase(kube_state_metrics_watch_total{result="error"}[10m]))
      > 0)
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Kubernetes workload state collection is failing
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: PrometheusConfigReloadFailed
    expr: prometheus_config_last_reload_successful == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Prometheus failed to reload its configuration
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: PrometheusScrapePressure
    expr: prometheus_target_interval_length_seconds{quantile="0.99"} > 30
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Prometheus scrape interval is falling behind
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: BoutiquePublicEndpointUnavailable
    expr: probe_success{job="http-probe"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Public HTTPS readiness check failed in {{ $labels.environment }}
      runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md
  - alert: BoutiquePublicCertificateExpiring
    expr: probe_ssl_earliest_cert_expiry{job="http-probe"} - time() < 14 * 86400
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Public TLS certificate expires within fourteen days in {{ $labels.environment
        }}
