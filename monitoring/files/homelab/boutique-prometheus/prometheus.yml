global:
  scrape_interval: 15s
  external_labels:
    cluster: homelab
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
rule_files:
- /etc/prometheus/rules.yml
scrape_configs:
- job_name: boutique
  metrics_path: /metrics
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names: &id001
      - boutique-dev
      - boutique-staging
      - boutique-production
    selectors:
    - role: pod
      label: app.kubernetes.io/part-of=boutique
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    regex: frontend|catalogue|cart
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    regex: http
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_phase
    regex: Running
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    target_label: service
  - source_labels:
    - __meta_kubernetes_namespace
    regex: boutique-(.*)
    target_label: environment
    replacement: $1
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - target_label: cluster
    replacement: homelab
- job_name: orders
  metrics_path: /actuator/prometheus
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names: *id001
    selectors:
    - role: pod
      label: app.kubernetes.io/part-of=boutique
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    regex: orders
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    regex: http
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_phase
    regex: Running
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    target_label: service
  - source_labels:
    - __meta_kubernetes_namespace
    regex: boutique-(.*)
    target_label: environment
    replacement: $1
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - target_label: cluster
    replacement: homelab
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
    labels:
      cluster: homelab
      environment: platform
- job_name: alertmanager
  static_configs:
  - targets:
    - alertmanager:9093
    labels:
      cluster: homelab
      environment: platform
- job_name: incident-bridge
  metrics_path: /metrics
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - monitoring
    selectors:
    - role: pod
      label: app=incident-bridge
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_container_name
    regex: incident-bridge
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    regex: http
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_phase
    regex: Running
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - target_label: service
    replacement: incident-bridge
  - target_label: environment
    replacement: dev
  - target_label: cluster
    replacement: homelab
- job_name: kube-state-metrics
  static_configs:
  - targets:
    - kube-state-metrics:8080
    labels:
      cluster: homelab
      environment: platform
  metric_relabel_configs:
  - source_labels:
    - namespace
    regex: boutique-(.*)
    target_label: environment
    replacement: $1
- job_name: kube-state-metrics-self
  static_configs:
  - targets:
    - kube-state-metrics:8081
    labels:
      cluster: homelab
      environment: platform
- job_name: node-exporter
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - monitoring-logs
    selectors:
    - role: pod
      label: app=node-exporter
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    regex: metrics
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
  - target_label: cluster
    replacement: homelab
  - target_label: environment
    replacement: platform
- job_name: loki
  static_configs:
  - targets:
    - loki:3100
    labels:
      cluster: homelab
      environment: platform
- job_name: alloy
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - monitoring-logs
    selectors:
    - role: pod
      label: app=alloy
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    regex: metrics
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
  - target_label: cluster
    replacement: homelab
  - target_label: environment
    replacement: platform
- job_name: http-probe
  metrics_path: /probe
  params:
    module:
    - https_ready
  static_configs:
  - targets:
    - https://dev-boutique.narx.space/health/ready
    labels:
      cluster: homelab
      environment: dev
      service: frontend
  - targets:
    - https://staging-boutique.narx.space/health/ready
    labels:
      cluster: homelab
      environment: staging
      service: frontend
  - targets:
    - https://shop.narx.space/health/ready
    labels:
      cluster: homelab
      environment: production
      service: frontend
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: blackbox-exporter:9115
- job_name: argo-rollouts
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - boutique-dev
      - boutique-staging
      - boutique-production
    selectors:
    - role: pod
      label: app.kubernetes.io/name=argo-rollouts
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    regex: metrics
    action: keep
  - source_labels:
    - __meta_kubernetes_namespace
    regex: boutique-(.*)
    target_label: environment
    replacement: $1
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - target_label: service
    replacement: frontend-rollouts
