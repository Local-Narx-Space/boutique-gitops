global:
  resolve_timeout: 5m
route:
  receiver: slack
  group_by:
  - cluster
  - project
  - environment
  - service
  - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - receiver: slack-production
    matchers:
    - environment="production"
    - severity="critical"
    group_wait: 10s
    repeat_interval: 1h
  - receiver: slack-production
    matchers:
    - environment="production"
  - receiver: slack-nonprod
    matchers:
    - environment=~"dev|qa|staging"
inhibit_rules:
- source_matchers:
  - severity="critical"
  target_matchers:
  - severity="warning"
  equal:
  - cluster
  - project
  - environment
  - service
receivers:
- name: slack
  slack_configs:
  - api_url_file: /run/secrets/slack_webhook
    send_resolved: true
    title: '[{{ .Status | toUpper }}][{{ .CommonLabels.environment }}] {{ .CommonLabels.alertname
      }}'
    text: '{{ range .Alerts }}{{ .Annotations.summary }}

      {{ .Annotations.runbook_url }}

      {{ end }}'
- name: slack-production
  slack_configs:
  - api_url_file: /run/secrets/slack_webhook_production
    send_resolved: true
    title: '[{{ .Status | toUpper }}][{{ .CommonLabels.environment }}] {{ .CommonLabels.alertname
      }}'
    text: '{{ range .Alerts }}{{ .Annotations.summary }}

      {{ .Annotations.runbook_url }}

      {{ end }}'
- name: slack-nonprod
  slack_configs:
  - api_url_file: /run/secrets/slack_webhook
    send_resolved: true
    title: '[{{ .Status | toUpper }}][{{ .CommonLabels.environment }}] {{ .CommonLabels.alertname
      }}'
    text: '{{ range .Alerts }}{{ .Annotations.summary }}

      {{ .Annotations.runbook_url }}

      {{ end }}'
