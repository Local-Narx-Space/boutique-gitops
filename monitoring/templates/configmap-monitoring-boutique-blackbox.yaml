{{- if .Values.kubernetesMetrics.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: boutique-blackbox
  namespace: monitoring
data:
  blackbox.yml: |
    modules:
      https_ready:
        prober: http
        timeout: 8s
        http:
          method: GET
          preferred_ip_protocol: ip4
          valid_status_codes: [200]
          fail_if_not_ssl: true
          follow_redirects: false
          tls_config:
            insecure_skip_verify: false
{{- end }}
