apiVersion: v1
kind: ConfigMap
metadata:
  name: boutique-prometheus
  namespace: monitoring
data:
  prometheus.yml: {{ (.Files.Get (printf "files/%s/boutique-prometheus/prometheus.yml" .Values.profile)) | toJson }}
  rules.yml: {{ (.Files.Get (printf "files/%s/boutique-prometheus/rules.yml" .Values.profile)) | toJson }}
