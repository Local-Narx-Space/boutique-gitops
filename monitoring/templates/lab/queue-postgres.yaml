{{- if .Values.lab.enabled }}
{{- if eq .Values.profile "production" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: incident-queue-postgres
  namespace: monitoring
spec:
  replicas: 1
  serviceName: incident-queue-postgres
  selector:
    matchLabels:
      app: incident-queue-postgres
  template:
    metadata:
      labels:
        app: incident-queue-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        args:
        - postgres
        - -c
        - ssl=on
        - -c
        - ssl_cert_file=/run/tls/tls.crt
        - -c
        - ssl_key_file=/run/tls/tls.key
        - -c
        - hba_file=/run/postgres-policy/pg_hba.conf
        env:
        - name: POSTGRES_USER
          value: incidentqueue
        - name: POSTGRES_DB
          value: incidentqueue
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: monitoring-incident-queue
              key: password
        - name: PGDATA
          value: /data/pgdata
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: tls
          mountPath: /run/tls
          readOnly: true
        - name: postgres-policy
          mountPath: /run/postgres-policy
          readOnly: true
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - incidentqueue
            - -d
            - incidentqueue
          periodSeconds: 5
        ports:
        - name: data
          containerPort: 5432
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tls
        secret:
          secretName: incident-queue-tls
          defaultMode: 288
      - name: postgres-policy
        configMap:
          name: incident-queue-tls-policy
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: incident-queue-postgres
  namespace: monitoring
spec:
  selector:
    app: incident-queue-postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: incident-queue-tls
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  secretName: incident-queue-tls
  issuerRef:
    name: boutique-lab-ca
    kind: ClusterIssuer
  dnsNames:
  - incident-queue-postgres
  - incident-queue-postgres.monitoring.svc
  - incident-queue-postgres.monitoring.svc.cluster.local
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
  - digital signature
  - key encipherment
  - server auth
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-queue-tls-policy
  namespace: monitoring
data:
  pg_hba.conf: {{ .Files.Get "files/lab/queue-postgres/pg_hba.conf" | toJson }}
{{- end }}
{{- end }}
