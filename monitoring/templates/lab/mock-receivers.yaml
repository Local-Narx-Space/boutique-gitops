{{- if .Values.lab.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-receivers
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-receivers
  template:
    metadata:
      labels:
        app: mock-receivers
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mock
        image: python:3.12-slim@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
        command:
        - python
        - -B
        - /app/mock-receivers.py
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        ports:
        - name: http
          containerPort: 18080
        readinessProbe:
          httpGet:
            path: /events
            port: http
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
      volumes:
      - name: code
        configMap:
          name: boutique-mock-receivers
---
apiVersion: v1
kind: Service
metadata:
  name: mock-receivers
  namespace: monitoring
spec:
  selector:
    app: mock-receivers
  ports:
  - port: 18080
    targetPort: http
{{- end }}
