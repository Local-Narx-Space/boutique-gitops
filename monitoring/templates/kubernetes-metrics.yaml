{{- if .Values.kubernetesMetrics.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: kube-state-metrics}
  template:
    metadata:
      labels: {app: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: kube-state-metrics
        image: {{ .Values.kubernetesMetrics.kubeStateMetricsImage | quote }}
        args:
        - --namespaces={{ join "," (concat .Values.applicationNamespaces (list "monitoring" "monitoring-logs")) }}
        - --resources=pods,deployments,statefulsets,daemonsets,replicasets,persistentvolumeclaims,jobs
        ports:
        - {name: metrics, containerPort: 8080}
        - {name: telemetry, containerPort: 8081}
        readinessProbe:
          httpGet: {path: /readyz, port: telemetry}
          timeoutSeconds: 3
        livenessProbe:
          httpGet: {path: /livez, port: metrics}
          initialDelaySeconds: 20
          timeoutSeconds: 3
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  selector: {app: kube-state-metrics}
  ports:
  - {name: metrics, port: 8080, targetPort: metrics}
  - {name: telemetry, port: 8081, targetPort: telemetry}
{{- range $namespace := concat .Values.applicationNamespaces (list "monitoring" "monitoring-logs") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-state-metrics
  namespace: {{ $namespace }}
rules:
- apiGroups: ['']
  resources: [pods, persistentvolumeclaims]
  verbs: [list, watch]
- apiGroups: [apps]
  resources: [deployments, statefulsets, daemonsets, replicasets]
  verbs: [list, watch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-state-metrics
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-state-metrics
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: monitoring
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring-logs
spec:
  selector:
    matchLabels: {app: node-exporter}
  template:
    metadata:
      labels: {app: node-exporter}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/os: linux}
      tolerations:
      - {operator: Exists, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: node-exporter
        image: {{ .Values.kubernetesMetrics.nodeExporterImage | quote }}
        args:
        - --path.procfs=/host/proc
        - --path.sysfs=/host/sys
        - --path.rootfs=/host/root
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        ports:
        - {name: metrics, containerPort: 9100}
        readinessProbe:
          httpGet: {path: /, port: metrics}
          timeoutSeconds: 3
        livenessProbe:
          httpGet: {path: /, port: metrics}
          initialDelaySeconds: 20
          timeoutSeconds: 3
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: proc, mountPath: /host/proc, readOnly: true}
        - {name: sys, mountPath: /host/sys, readOnly: true}
        - {name: root, mountPath: /host/root, readOnly: true}
      volumes:
      - name: proc
        hostPath: {path: /proc, type: Directory}
      - name: sys
        hostPath: {path: /sys, type: Directory}
      - name: root
        hostPath: {path: /, type: Directory}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-exporter-scrape
  namespace: monitoring-logs
spec:
  podSelector:
    matchLabels: {app: node-exporter}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels: {app: prometheus}
    ports:
    - {port: 9100, protocol: TCP}
  egress: []
{{- end }}
