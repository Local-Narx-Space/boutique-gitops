apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-monitoring-boutique-alertmanager.yaml") . | sha256sum }}
      labels:
        app: alertmanager
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/data
        image: prom/alertmanager@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
        name: alertmanager
        ports:
        - containerPort: 9093
          name: http
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /etc/alertmanager
          name: config
          readOnly: true
        - mountPath: /data
          name: data
        - mountPath: /run/secrets
          name: secrets
          readOnly: true
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      volumes:
      - configMap:
          name: boutique-alertmanager
        name: config
      - name: data
        persistentVolumeClaim:
          claimName: alertmanager-data
      - name: secrets
        secret:
          defaultMode: 292
          items:
          - key: slack_webhook
            path: slack_webhook
          {{- if and (eq .Values.profile "homelab") (not .Values.incidentBridge.enabled) }}
          - key: {{ .Values.productionSlackWebhookKey }}
            path: slack_webhook_production
          {{- end }}
          {{- if .Values.incidentBridge.enabled }}
          - key: webhook_token
            path: webhook_token
          {{- end }}
          secretName: monitoring-integrations
