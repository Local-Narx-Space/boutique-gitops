{{- if eq .Values.profile "production" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: incident-queue-egress
  namespace: monitoring
spec:
  egress:
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - ipBlock:
        cidr: 192.0.2.0/24
  podSelector:
    matchLabels:
      app: incident-bridge
  policyTypes:
  - Egress
{{- end }}
