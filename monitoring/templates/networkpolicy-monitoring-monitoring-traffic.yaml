apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-traffic
  namespace: monitoring
spec:
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring-logs
      podSelector:
        matchLabels:
          app: node-exporter
    ports:
    - port: 9100
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring-logs
      podSelector:
        matchLabels:
          app: alloy
    ports:
    - port: 12345
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  - ports:
    - port: 8080
      protocol: TCP
    - port: 8081
      protocol: TCP
    - port: 8082
      protocol: TCP
    - port: 8083
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: boutique-dev
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: boutique-staging
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: boutique-production
  {{- if .Values.integration.namespaces }}
  - to:
    {{- range .Values.integration.namespaces }}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: {{ . | quote }}}
    {{- end }}
    ports:
    - {protocol: TCP, port: 8080}
    - {protocol: TCP, port: 8081}
    - {protocol: TCP, port: 8082}
    - {protocol: TCP, port: 8083}
    - {protocol: TCP, port: 8090}
  {{- end }}
  - ports:
    - port: 443
      protocol: TCP
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: boutique-dev
      podSelector:
        matchLabels:
          app.kubernetes.io/name: argo-rollouts
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: boutique-staging
      podSelector:
        matchLabels:
          app.kubernetes.io/name: argo-rollouts
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: boutique-production
      podSelector:
        matchLabels:
          app.kubernetes.io/name: argo-rollouts
    ports:
    - protocol: TCP
      port: 8090
  {{- with .Values.integration.egressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring-logs
    ports:
    - port: 3100
      protocol: TCP
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
