apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-traffic
  namespace: monitoring
spec:
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  - ports:
    - port: 8080
      protocol: TCP
    - port: 8081
      protocol: TCP
    - port: 8082
      protocol: TCP
    - port: 8083
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: boutique-dev
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: boutique-staging
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: boutique-production
  - ports:
    - port: 443
      protocol: TCP
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring-logs
    ports:
    - port: 3100
      protocol: TCP
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
