{{- if .Values.kubernetesApiEndpoint }}
{{- $collectors := list (dict "namespace" "monitoring" "app" "prometheus") (dict "namespace" "monitoring-logs" "app" "alloy") }}
{{- if .Values.kubernetesMetrics.enabled }}
{{- $collectors = append $collectors (dict "namespace" "monitoring" "app" "kube-state-metrics") }}
{{- end }}
{{- range $collector := $collectors }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ if eq $collector.app "kube-state-metrics" }}kube-state-metrics-kubernetes-api{{ else }}collector-kubernetes-api{{ end }}
  namespace: {{ $collector.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ $collector.app }}
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: {{ $.Values.kubernetesApiEndpoint.cidr | quote }}
    ports:
    - protocol: TCP
      port: {{ $.Values.kubernetesApiEndpoint.port }}
{{- end }}
{{- end }}
