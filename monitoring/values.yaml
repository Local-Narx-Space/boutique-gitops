profile: base
applicationNamespaces:
- boutique-dev
alloy:
  cluster: homelab
  spec:
    selector:
      matchLabels:
        app: alloy
    template:
      metadata:
        labels:
          app: alloy
      spec:
        containers:
        - args:
          - run
          - /etc/alloy/config.alloy
          - --storage.path=/var/lib/alloy
          - --server.http.listen-addr=0.0.0.0:12345
          env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: CLUSTER_NAME
            value: homelab
          image: grafana/alloy@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
          name: alloy
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
          - mountPath: /etc/alloy
            name: config
            readOnly: true
          - mountPath: /var/log/pods
            name: logs
            readOnly: true
          - mountPath: /var/lib/alloy
            name: state
          ports:
          - name: metrics
            containerPort: 12345
          readinessProbe:
            httpGet:
              path: /-/ready
              port: metrics
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: metrics
            timeoutSeconds: 3
            initialDelaySeconds: 30
        serviceAccountName: alloy
        volumes:
        - configMap:
            name: boutique-alloy
          name: config
        - hostPath:
            path: /var/log/pods
            type: Directory
          name: logs
        - name: state
          hostPath:
            path: /var/lib/boutique-alloy
            type: DirectoryOrCreate
        nodeSelector:
          kubernetes.io/os: linux
        tolerations:
        - operator: Exists
          effect: NoSchedule
incidentBridge:
  enabled: false
  image:
    repository: ghcr.io/subhankar12-spec/boutique-incident-bridge
    tag: replace-with-tested-digest
    digest: ''
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: incident-bridge
    strategy:
      type: Recreate
    template:
      metadata:
        labels:
          app: incident-bridge
      spec:
        automountServiceAccountToken: false
        containers:
        - env:
          - name: QUEUE_PATH
            value: /data/queue.db
          - name: WEBHOOK_TOKEN_FILE
            value: /run/secrets/webhook_token
          - name: SERVICENOW_URL
            value: https://REPLACE.service-now.com
          - name: SERVICENOW_USERNAME
            value: boutique-integration
          - name: SERVICENOW_PASSWORD_FILE
            value: /run/secrets/servicenow_password
          image: ghcr.io/subhankar12-spec/boutique-incident-bridge:replace-with-tested-digest
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          name: incident-bridge
          ports:
          - containerPort: 8084
            name: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
          - mountPath: /etc/incident-bridge
            name: config
            readOnly: true
          - mountPath: /data
            name: data
          - mountPath: /run/secrets
            name: secrets
            readOnly: true
        securityContext:
          fsGroup: 65532
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        volumes:
        - configMap:
            name: boutique-incident-bridge
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: incident-bridge-data
        - name: secrets
          secret:
            defaultMode: 292
            items:
            - key: webhook_token
              path: webhook_token
            - key: servicenow_password
              path: servicenow_password
            secretName: monitoring-integrations
lab:
  enabled: false
kubernetesMetrics:
  enabled: false
prometheusStorage:
  retentionTime: 7d
  retentionSize: 4GB
productionSlackWebhookKey: slack_webhook
