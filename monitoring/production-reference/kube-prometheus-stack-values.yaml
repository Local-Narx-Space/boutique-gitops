grafana:
  enabled: true
  admin:
    existingSecret: monitoring-integrations
    userKey: grafana_username
    passwordKey: grafana_password
  persistence:
    enabled: true
    size: 5Gi
  ingress:
    enabled: false
  grafana.ini:
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false
prometheus:
  prometheusSpec:
    replicas: 2
    retention: 15d
    podAntiAffinity: hard
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: '2'
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
    additionalScrapeConfigs:
    - job_name: boutique
      metrics_path: /metrics
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - boutique-production
        selectors:
        - role: pod
          label: app.kubernetes.io/part-of=boutique
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_pod_label_app_kubernetes_io_name
        regex: frontend|catalogue|cart
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_container_port_name
        regex: http
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_phase
        regex: Running
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_label_app_kubernetes_io_name
        target_label: service
      - source_labels:
        - __meta_kubernetes_namespace
        regex: boutique-(.*)
        target_label: environment
        replacement: $1
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
      - target_label: cluster
        replacement: production
    - job_name: orders
      metrics_path: /actuator/prometheus
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - boutique-production
        selectors:
        - role: pod
          label: app.kubernetes.io/part-of=boutique
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_pod_label_app_kubernetes_io_name
        regex: orders
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_container_port_name
        regex: http
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_phase
        regex: Running
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_label_app_kubernetes_io_name
        target_label: service
      - source_labels:
        - __meta_kubernetes_namespace
        regex: boutique-(.*)
        target_label: environment
        replacement: $1
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
      - target_label: cluster
        replacement: production
    - job_name: incident-bridge
      static_configs:
      - targets:
        - incident-bridge:8084
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack
      group_by:
      - cluster
      - environment
      - service
      - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
      - receiver: servicenow
        matchers:
        - environment="production"
        - severity="critical"
        continue: true
      - receiver: slack
        matchers:
        - severity=~"warning|critical"
    inhibit_rules:
    - source_matchers:
      - severity="critical"
      target_matchers:
      - severity="warning"
      equal:
      - cluster
      - environment
      - service
    receivers:
    - name: slack
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/monitoring-integrations/slack_webhook
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}

          {{ .Annotations.runbook_url }}

          {{ end }}'
    - name: servicenow
      webhook_configs:
      - url: http://incident-bridge:8084/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/monitoring-integrations/webhook_token
  alertmanagerSpec:
    replicas: 3
    podAntiAffinity: hard
    secrets:
    - monitoring-integrations
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
additionalPrometheusRulesMap:
  boutique:
    groups:
    - name: boutique
      rules:
      - record: boutique:requests:rate5m
        expr: sum by (service, environment, cluster) (rate(boutique_http_requests_total[5m]))
          or sum by (service, environment, cluster) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
      - record: boutique:errors:rate5m
        expr: sum by (service, environment, cluster) (rate(boutique_http_requests_total{status=~"5.."}[5m]))
          or sum by (service, environment, cluster) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[5m]))
          or (0 * boutique:requests:rate5m)
      - record: boutique:latency:p95
        expr: histogram_quantile(0.95, sum by (le, service, environment, cluster)
          (rate(boutique_http_request_duration_seconds_bucket[5m]))) or histogram_quantile(0.95,
          sum by (le, service, environment, cluster) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m])))
      - alert: BoutiqueServiceDown
        expr: up{job=~"boutique|orders"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.service }} is unavailable in {{ $labels.environment
            }}'
          runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md#service-down
      - alert: BoutiqueHighErrorRate
        expr: (boutique:errors:rate5m / boutique:requests:rate5m > 0.05) and (boutique:requests:rate5m
          > 0.1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: HTTP 5xx exceeds 5 percent for {{ $labels.service }}
      - alert: BoutiqueHighLatency
        expr: (boutique:latency:p95 > 1) and (boutique:requests:rate5m > 0.1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: HTTP p95 exceeds one second for {{ $labels.service }}
      - alert: IncidentDeliveryBacklog
        expr: boutique_incident_oldest_seconds > 300
        for: 5m
        labels:
          severity: critical
          service: incident-bridge
        annotations:
          summary: ServiceNow incident delivery has been delayed for over five minutes
      - alert: AlertmanagerDeliveryFailures
        expr: increase(alertmanager_notifications_failed_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Alertmanager receiver delivery is failing
      - alert: PrometheusRuleFailures
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Prometheus rule evaluations are failing
      - alert: BoutiqueServiceMissing
        expr: absent(up{job=~"boutique|orders",service="frontend",environment="production",cluster="production"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: No running scrape targets for frontend in production
      - alert: BoutiqueServiceMissing
        expr: absent(up{job=~"boutique|orders",service="catalogue",environment="production",cluster="production"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: No running scrape targets for catalogue in production
      - alert: BoutiqueServiceMissing
        expr: absent(up{job=~"boutique|orders",service="cart",environment="production",cluster="production"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: No running scrape targets for cart in production
      - alert: BoutiqueServiceMissing
        expr: absent(up{job=~"boutique|orders",service="orders",environment="production",cluster="production"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: No running scrape targets for orders in production
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
