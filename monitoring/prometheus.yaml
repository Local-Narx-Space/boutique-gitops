apiVersion: v1
kind: ConfigMap
metadata:
  name: boutique-prometheus
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files: [/etc/prometheus/rules.yml]
    scrape_configs:
      - job_name: boutique
        static_configs:
          - targets: [frontend.boutique-dev.svc:8080, catalogue.boutique-dev.svc:8081, cart.boutique-dev.svc:8082]
            labels: {environment: dev}
          - targets: [frontend.boutique-staging.svc:8080, catalogue.boutique-staging.svc:8081, cart.boutique-staging.svc:8082]
            labels: {environment: staging}
          - targets: [frontend.boutique-production.svc:8080, catalogue.boutique-production.svc:8081, cart.boutique-production.svc:8082]
            labels: {environment: production}
      - job_name: orders
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: [orders.boutique-dev.svc:8083]
            labels: {environment: dev}
          - targets: [orders.boutique-staging.svc:8083]
            labels: {environment: staging}
          - targets: [orders.boutique-production.svc:8083]
            labels: {environment: production}
  rules.yml: |
    groups:
      - name: boutique
        rules:
          - alert: BoutiqueServiceDown
            expr: up{job=~"boutique|orders"} == 0
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: "Boutique target {{ $labels.instance }} is unavailable"
          - alert: BoutiqueFrontendErrors
            expr: rate(boutique_frontend_errors_total[5m]) / clamp_min(rate(boutique_frontend_requests_total[5m]), 0.01) > 0.05
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "Frontend 5xx rate exceeds 5 percent"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.3.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/data", "--storage.tsdb.retention.time=7d"]
          ports: [{name: http, containerPort: 9090}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts: [{name: config, mountPath: /etc/prometheus}, {name: data, mountPath: /data}]
      volumes: [{name: config, configMap: {name: boutique-prometheus}}, {name: data, persistentVolumeClaim: {claimName: prometheus-data}}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: prometheus-data, namespace: monitoring}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: monitoring}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: http}]
