apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- rbac.yaml
- incident-bridge-availability.yaml
patches:
- target:
    kind: ConfigMap
    name: boutique-prometheus
  patch: |
    - op: replace
      path: /data/prometheus.yml
      value: |
        global:
          scrape_interval: 15s
          external_labels:
            cluster: production
        alerting:
          alertmanagers:
          - static_configs:
            - targets:
              - alertmanager:9093
        rule_files:
        - /etc/prometheus/rules.yml
        scrape_configs:
        - job_name: boutique
          metrics_path: /metrics
          kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - boutique-production
            selectors:
            - role: pod
              label: app.kubernetes.io/part-of=boutique
          relabel_configs:
          - source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            regex: frontend|catalogue|cart
            action: keep
          - source_labels:
            - __meta_kubernetes_pod_container_port_name
            regex: http
            action: keep
          - source_labels:
            - __meta_kubernetes_pod_phase
            regex: Running
            action: keep
          - source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            target_label: service
          - source_labels:
            - __meta_kubernetes_namespace
            regex: boutique-(.*)
            target_label: environment
            replacement: $1
          - source_labels:
            - __meta_kubernetes_pod_name
            target_label: pod
          - target_label: cluster
            replacement: production
        - job_name: orders
          metrics_path: /actuator/prometheus
          kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - boutique-production
            selectors:
            - role: pod
              label: app.kubernetes.io/part-of=boutique
          relabel_configs:
          - source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            regex: orders
            action: keep
          - source_labels:
            - __meta_kubernetes_pod_container_port_name
            regex: http
            action: keep
          - source_labels:
            - __meta_kubernetes_pod_phase
            regex: Running
            action: keep
          - source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            target_label: service
          - source_labels:
            - __meta_kubernetes_namespace
            regex: boutique-(.*)
            target_label: environment
            replacement: $1
          - source_labels:
            - __meta_kubernetes_pod_name
            target_label: pod
          - target_label: cluster
            replacement: production
        - job_name: prometheus
          static_configs:
          - targets:
            - localhost:9090
        - job_name: alertmanager
          static_configs:
          - targets:
            - alertmanager:9093
        - job_name: incident-bridge
          metrics_path: /metrics
          kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - monitoring
            selectors:
            - role: pod
              label: app=incident-bridge
          relabel_configs:
          - source_labels:
            - __meta_kubernetes_pod_container_name
            regex: incident-bridge
            action: keep
          - source_labels:
            - __meta_kubernetes_pod_container_port_name
            regex: http
            action: keep
          - source_labels:
            - __meta_kubernetes_pod_phase
            regex: Running
            action: keep
          - source_labels:
            - __meta_kubernetes_pod_name
            target_label: pod
          - source_labels:
            - __meta_kubernetes_namespace
            target_label: namespace
          - target_label: service
            replacement: incident-bridge
          - target_label: environment
            replacement: production
          - target_label: cluster
            replacement: production
    - op: replace
      path: /data/rules.yml
      value: |
        groups:
        - name: boutique
          rules:
          - record: boutique:incident:pending
            expr: max by (cluster, environment) (boutique_incident_pending{job="incident-bridge"})
          - record: boutique:incident:oldest_seconds
            expr: max by (cluster, environment) (boutique_incident_oldest_seconds{job="incident-bridge"})
          - record: boutique:incident:dead_letters
            expr: max by (cluster, environment) (boutique_incident_dead_letters{job="incident-bridge"})
          - record: boutique:incident:retry_attempts
            expr: max by (cluster, environment) (boutique_incident_retry_attempts{job="incident-bridge"})
          - record: boutique:requests:rate5m
            expr: sum by (service, environment, cluster) (rate(boutique_http_requests_total[5m])) or sum by (service, environment,
              cluster) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
          - record: boutique:errors:rate5m
            expr: sum by (service, environment, cluster) (rate(boutique_http_requests_total{status=~"5.."}[5m])) or sum by (service,
              environment, cluster) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[5m])) or (0 * boutique:requests:rate5m)
          - record: boutique:latency:p95
            expr: histogram_quantile(0.95, sum by (le, service, environment, cluster) (rate(boutique_http_request_duration_seconds_bucket[5m])))
              or histogram_quantile(0.95, sum by (le, service, environment, cluster) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m])))
          - alert: BoutiqueServiceDown
            expr: up{job=~"boutique|orders"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: '{{ $labels.service }} is unavailable in {{ $labels.environment }}'
              runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/docs/monitoring.md#service-down
          - alert: BoutiqueHighErrorRate
            expr: (boutique:errors:rate5m / boutique:requests:rate5m > 0.05) and (boutique:requests:rate5m > 0.1)
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: HTTP 5xx exceeds 5 percent for {{ $labels.service }}
          - alert: BoutiqueHighLatency
            expr: (boutique:latency:p95 > 1) and (boutique:requests:rate5m > 0.1)
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: HTTP p95 exceeds one second for {{ $labels.service }}
          - alert: AlertmanagerDeliveryFailures
            expr: increase(alertmanager_notifications_failed_total[10m]) > 0
            for: 2m
            labels:
              severity: warning
              incident_delivery: disabled
            annotations:
              summary: Alertmanager receiver delivery is failing
          - alert: PrometheusRuleFailures
            expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Prometheus rule evaluations are failing
          - alert: BoutiqueServiceMissing
            expr: absent(up{job=~"boutique|orders",service="frontend",environment="production",cluster="production"})
            for: 2m
            labels:
              severity: critical
              service: frontend
              environment: production
              cluster: production
            annotations:
              summary: No running scrape targets for frontend in production
          - alert: BoutiqueServiceMissing
            expr: absent(up{job=~"boutique|orders",service="catalogue",environment="production",cluster="production"})
            for: 2m
            labels:
              severity: critical
              service: catalogue
              environment: production
              cluster: production
            annotations:
              summary: No running scrape targets for catalogue in production
          - alert: BoutiqueServiceMissing
            expr: absent(up{job=~"boutique|orders",service="cart",environment="production",cluster="production"})
            for: 2m
            labels:
              severity: critical
              service: cart
              environment: production
              cluster: production
            annotations:
              summary: No running scrape targets for cart in production
          - alert: BoutiqueServiceMissing
            expr: absent(up{job=~"boutique|orders",service="orders",environment="production",cluster="production"})
            for: 2m
            labels:
              severity: critical
              service: orders
              environment: production
              cluster: production
            annotations:
              summary: No running scrape targets for orders in production
          - alert: IncidentDeliveryBacklog
            expr: boutique:incident:oldest_seconds > 300
            for: 5m
            labels:
              severity: critical
              service: incident-bridge
              incident_delivery: disabled
            annotations:
              summary: ServiceNow incident delivery has been delayed for over five minutes
              runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
          - alert: IncidentDeliveryDeadLetters
            expr: boutique:incident:dead_letters > 0
            for: 1m
            labels:
              severity: critical
              service: incident-bridge
              incident_delivery: disabled
            annotations:
              summary: Incident delivery exhausted retries; operator recovery is required
              runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
          - alert: IncidentWorkerStalled
            expr: boutique_incident_worker_heartbeat_age_seconds{job="incident-bridge"} > 60
            for: 2m
            labels:
              severity: critical
              service: incident-bridge
              incident_delivery: disabled
            annotations:
              summary: Incident worker {{ $labels.pod }} heartbeat is stale
              runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
          - alert: IncidentBridgeUnavailable
            expr: up{job="incident-bridge"} == 0
            for: 2m
            labels:
              severity: critical
              service: incident-bridge
              incident_delivery: disabled
            annotations:
              summary: Incident bridge {{ $labels.pod }} cannot be scraped
              runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
          - alert: IncidentBridgeMissing
            expr: absent(up{job="incident-bridge"})
            for: 2m
            labels:
              severity: critical
              service: incident-bridge
              incident_delivery: disabled
            annotations:
              summary: No incident bridge scrape targets are present
              runbook_url: https://github.com/subhankar12-spec/boutique-platform/blob/main/monitoring/incident-bridge/README.md#delivery-guarantees-and-failure-recovery
- target:
    kind: DaemonSet
    name: alloy
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: production
- target:
    kind: ConfigMap
    name: boutique-alloy
  patch: |
    - op: replace
      path: /data/config.alloy
      value: "discovery.kubernetes \"pods\" {\n  role = \"pod\"\n  namespaces { names\
        \ = [\"boutique-production\"] }\n  selectors {\n    role = \"pod\"\n    label\
        \ = \"app.kubernetes.io/part-of=boutique\"\n    field = \"spec.nodeName=\" + sys.env(\"\
        NODE_NAME\")\n  }\n}\ndiscovery.relabel \"logs\" {\n  targets = discovery.kubernetes.pods.targets\n\
        \  rule { source_labels = [\"__meta_kubernetes_namespace\"]\n    target_label\
        \ = \"environment\"\n    regex = \"boutique-(.*)\"\n    replacement = \"$1\" }\n\
        \  rule { source_labels = [\"__meta_kubernetes_namespace\"]\n    regex = \"boutique-(dev|staging|production)\"\
        \n    action = \"keep\" }\n  rule { source_labels = [\"__meta_kubernetes_pod_label_app_kubernetes_io_name\"\
        ]\n    target_label = \"service\" }\n  rule { source_labels = [\"__meta_kubernetes_pod_container_name\"\
        ]\n    target_label = \"container\" }\n  rule { source_labels = [\"__meta_kubernetes_pod_uid\"\
        , \"__meta_kubernetes_pod_container_name\"]\n    separator = \"/\"\n    target_label\
        \ = \"__path__\"\n    replacement = \"/var/log/pods/*$1/*.log\" }\n  rule {\n\
        \    target_label = \"cluster\"\n    replacement = sys.env(\"CLUSTER_NAME\") }\n\
        }\nloki.source.file \"pods\" {\n  targets = discovery.relabel.logs.output\n  forward_to\
        \ = [loki.process.cri.receiver]\n}\nloki.process \"cri\" {\n  stage.cri {}\n \
        \ forward_to = [loki.write.default.receiver]\n}\nloki.write \"default\" {\n  endpoint\
        \ { url = \"http://loki.monitoring.svc:3100/loki/api/v1/push\" }\n}\n"
- path: incident-bridge.yaml
- path: incident-bridge-pvc-delete.yaml
