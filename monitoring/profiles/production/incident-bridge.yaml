apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-bridge
  namespace: monitoring
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: incident-bridge
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: incident-bridge
      containers:
      - name: incident-bridge
        env:
        - name: QUEUE_PATH
          $patch: delete
        - name: QUEUE_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: monitoring-incident-queue
              key: QUEUE_DATABASE_URL
        - name: SERVICENOW_MODE
          value: scripted
        volumeMounts:
        - name: data
          $patch: delete
        - name: queue-ca
          mountPath: /run/queue-ca
          readOnly: true
      volumes:
      - name: data
        $patch: delete
      - name: queue-ca
        secret:
          secretName: monitoring-incident-queue
          defaultMode: 292
          items:
          - key: postgresql_ca
            path: ca.crt
