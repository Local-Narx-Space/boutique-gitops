apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: incident-bridge
  namespace: monitoring
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: incident-bridge
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: incident-queue-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: incident-bridge
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 192.0.2.0/24
    ports:
    - protocol: TCP
      port: 5432
