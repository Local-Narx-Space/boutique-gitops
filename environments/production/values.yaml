lab:
  enabled: false
frontend:
  replicaCount: 2
  pdb:
    enabled: true
  deployment:
    template:
      spec:
        containers:
        - env:
          - name: PUBLIC_ORIGIN
            value: https://production.boutique.example.com
          - name: COOKIE_SECURE
            value: 'true'
          - name: CATALOGUE_URL
            value: http://catalogue:8081
          - name: CART_URL
            value: http://cart:8082
          - name: ORDERS_URL
            value: http://orders:8083
          - name: SESSION_SECRET
            valueFrom:
              secretKeyRef:
                key: secret
                name: frontend-session
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          name: frontend
          ports:
          - containerPort: 8080
            name: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 7
          resources:
            limits:
              cpu: 1000m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
          volumeMounts:
          - mountPath: /tmp
            name: tmp
catalogue:
  replicaCount: 2
  pdb:
    enabled: true
cart:
  replicaCount: 2
  pdb:
    enabled: true
orders:
  replicaCount: 2
  pdb:
    enabled: true
localDevelopment:
  enabled: false

# Activate only after controller/verification prerequisites and reviewed migration.
progressiveDelivery:
  enabled: false

frontendAutoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60
