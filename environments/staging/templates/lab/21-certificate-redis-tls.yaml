{{- if .Values.lab.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
  name: redis-tls
  namespace: boutique-staging
spec:
  dnsNames:
  - redis
  - redis.boutique-staging.svc
  - redis.boutique-staging.svc.cluster.local
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: boutique-lab-ca
  privateKey:
    algorithm: RSA
    rotationPolicy: Always
    size: 2048
  renewBefore: 360h
  secretName: redis-tls
  usages:
  - digital signature
  - key encipherment
  - server auth
{{- end }}
