{{- if .Values.lab.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: boutique-staging
spec:
  egress: []
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: cart
    ports:
    - port: 6379
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
  - Ingress
  - Egress
{{- end }}
