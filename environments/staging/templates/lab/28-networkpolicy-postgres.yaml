{{- if .Values.lab.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: boutique-staging
spec:
  egress: []
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: orders
    ports:
    - port: 5432
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
  - Ingress
  - Egress
{{- end }}
