cart:
  deployment:
    template:
      spec:
        containers:
        - env:
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                key: url
                name: cart-redis
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          name: cart
          ports:
          - containerPort: 8082
            name: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 7
          resources:
            limits:
              cpu: 1000m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
          volumeMounts:
          - mountPath: /tmp
            name: tmp
        imagePullSecrets:
        - name: ghcr-pull
  pdb:
    enabled: false
  replicaCount: 1
