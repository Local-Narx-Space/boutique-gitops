apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-monitoring
  namespace: monitoring
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/boutique-production-monitoring-external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-monitoring
  namespace: monitoring
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-monitoring
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-incident-queue
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-monitoring
    kind: SecretStore
  target:
    name: monitoring-incident-queue
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: QUEUE_DATABASE_URL
    remoteRef:
      key: boutique-production/monitoring/incident-queue
      property: QUEUE_DATABASE_URL
  - secretKey: postgresql_ca
    remoteRef:
      key: boutique-production/monitoring/incident-queue
      property: postgresql_ca
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-integrations
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-monitoring
    kind: SecretStore
  target:
    name: monitoring-integrations
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: slack_webhook
    remoteRef:
      key: boutique-production/monitoring/integrations
      property: slack_webhook
  - secretKey: webhook_token
    remoteRef:
      key: boutique-production/monitoring/integrations
      property: webhook_token
  - secretKey: servicenow_password
    remoteRef:
      key: boutique-production/monitoring/integrations
      property: servicenow_password
  - secretKey: grafana_password
    remoteRef:
      key: boutique-production/monitoring/integrations
      property: grafana_password
