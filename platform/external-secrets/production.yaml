apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: boutique-production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/boutique-production-production-external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws
  namespace: boutique-production
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-session
  namespace: boutique-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws
    kind: SecretStore
  target:
    name: frontend-session
    creationPolicy: Owner
  data:
  - secretKey: secret
    remoteRef:
      key: boutique-production/production/application
      property: session_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cart-redis
  namespace: boutique-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws
    kind: SecretStore
  target:
    name: cart-redis
    creationPolicy: Owner
  data:
  - secretKey: url
    remoteRef:
      key: boutique-production/production/application
      property: redis_url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-database
  namespace: boutique-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws
    kind: SecretStore
  target:
    name: orders-database
    creationPolicy: Owner
  data:
  - secretKey: url
    remoteRef:
      key: boutique-production/production/application
      property: database_url
  - secretKey: username
    remoteRef:
      key: boutique-production/production/application
      property: database_username
  - secretKey: password
    remoteRef:
      key: boutique-production/production/application
      property: database_password
