deployment:
  replicas: 2
service:
  type: LoadBalancer
ports:
  web:
    redirections:
      entryPoint:
        to: websecure
        scheme: https
providers:
  kubernetesIngress:
    publishedService:
      enabled: true
logs:
  general:
    format: json
  access:
    enabled: true
    format: json
